name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (tests + Puppeteer smoke)
        run: npm ci
      - name: Syntax check all JS
        run: |
          set -e
          for f in js/*.js sw.js scripts/*.mjs; do node --check "$f"; done
      - name: Version sync (version.js ↔ sw.js ↔ pwa.js)
        run: node scripts/check-version-sync.mjs
      - name: Asset references
        run: node scripts/check-assets.mjs
      - name: Inline handler audit (CSP guard — no onclick=/onchange= in HTML)
        run: node scripts/check-inline-handlers.mjs
      - name: Tests
        run: node scripts/run-tests.mjs
      - name: Browser smoke (tasks → settings nav, CSP-safe handlers)
        env:
          CI: 'true'
        run: |
          node ./node_modules/serve/build/main.js -l 8080 -s . &
          npx wait-on http://127.0.0.1:8080 -t 120000 -i 500
          npm run smoke
